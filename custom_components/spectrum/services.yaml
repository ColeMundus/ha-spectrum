add_port_forward:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: spectrum
    client:
      required: true
      example: "AA:BB:CC:DD:EE:FF"
      selector:
        text:
    external_port:
      required: true
      example: 8443
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    internal_port:
      required: false
      example: 443
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    protocol:
      required: false
      default: TCP
      selector:
        select:
          options:
            - TCP
            - UDP
            - TCP_AND_UDP
    name:
      required: false
      example: "Home Server"
      selector:
        text:
    ip_address:
      required: false
      example: "192.168.1.50"
      selector:
        text:
    auto_reserve:
      required: false
      default: false
      selector:
        boolean:

