set_access_schedule:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: spectrum
    target_type:
      required: true
      default: client
      selector:
        select:
          options:
            - client
            - client_group
    target:
      required: true
      example: "Kids Tablet"
      selector:
        text:
    name:
      required: true
      example: "School Nights"
      selector:
        text:
    start_time:
      required: true
      example: "21:00"
      selector:
        time:
    end_time:
      required: true
      example: "07:00"
      selector:
        time:
    days_of_week:
      required: true
      selector:
        select:
          multiple: true
          options:
            - SUN
            - MON
            - TUE
            - WED
            - THU
            - FRI
            - SAT
    enabled:
      required: false
      default: true
      selector:
        boolean:
    create:
      required: false
      default: false
      selector:
        boolean:

